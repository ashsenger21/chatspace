<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatSpace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ============================================================
     MAIN APP LAYOUT
     Left sidebar (conversation list) + Right panel (chat)
     ============================================================ -->
<div class="app-container" id="appContainer">

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">

        <!-- Sidebar Header -->
        <div class="sidebar-header">
            <div class="sidebar-header-top">
                <!-- Current user's avatar + name -->
                <div class="current-user-info" id="currentUserInfo" onclick="openProfile()">
                    <div class="avatar avatar-sm" id="sidebarAvatar">
                        <img src="" alt="" id="sidebarAvatarImg" style="display:none">
                        <span id="sidebarAvatarInitial"></span>
                    </div>
                    <span class="current-username" id="sidebarUsername">Loading…</span>
                </div>

                <!-- Action buttons -->
                <div class="sidebar-actions">
                    <button class="icon-btn" title="New chat" onclick="openNewChat()" id="newChatBtn">
                        <!-- Pencil / compose icon -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" title="Settings / Profile" onclick="openProfile()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" title="Toggle theme" onclick="toggleTheme()" id="themeBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button class="icon-btn logout-btn" title="Logout" onclick="logout()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Search bar -->
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input
                    type="text"
                    id="sidebarSearch"
                    placeholder="Search or start new chat"
                    oninput="handleSidebarSearch(this.value)"
                >
                <button class="clear-search" id="clearSearch" onclick="clearSidebarSearch()" style="display:none">×</button>
            </div>
        </div>

        <!-- New Chat Panel (shown when user clicks new chat) -->
        <div class="new-chat-panel" id="newChatPanel" style="display:none">
            <div class="panel-header">
                <button class="back-btn" onclick="closeNewChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <span>New Chat</span>
            </div>
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input
                    type="text"
                    id="userSearch"
                    placeholder="Search users…"
                    oninput="searchUsers(this.value)"
                    autofocus
                >
            </div>
            <div id="userSearchResults" class="user-search-results"></div>
        </div>

        <!-- Conversation List -->
        <div class="conversation-list" id="conversationList">
            <div class="loading-conversations">
                <div class="spinner"></div>
            </div>
        </div>
    </aside>

    <!-- ===== RIGHT PANEL ===== -->
    <main class="chat-panel" id="chatPanel">

        <!-- Welcome Screen (shown when no conversation is selected) -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-content">
                <div class="welcome-icon">
                    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="60" cy="60" r="55" fill="var(--bg-secondary)" stroke="var(--border)" stroke-width="2"/>
                        <path d="M60 30C43.43 30 30 43.43 30 60c0 5.33 1.38 10.33 3.8 14.67L30 90l15.87-3.73A29.83 29.83 0 0060 90c16.57 0 30-13.43 30-30S76.57 30 60 30z" fill="var(--accent)" opacity="0.2"/>
                        <path d="M60 35C46.2 35 35 46.2 35 60c0 4.67 1.2 9.07 3.33 12.87L35 78l5.27-1.23A24.87 24.87 0 0060 85c13.8 0 25-11.2 25-25S73.8 35 60 35z" fill="var(--accent)"/>
                        <circle cx="52" cy="60" r="3" fill="white"/>
                        <circle cx="60" cy="60" r="3" fill="white"/>
                        <circle cx="68" cy="60" r="3" fill="white"/>
                    </svg>
                </div>
                <h2>Welcome to ChatSpace</h2>
                <p>Select a conversation to start chatting,<br>or search for a user to begin a new one.</p>
                <button class="btn-outline" onclick="openNewChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
                        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                    Start a New Chat
                </button>
            </div>
        </div>

        <!-- Chat Window (shown when a conversation is selected) -->
        <div class="chat-window" id="chatWindow" style="display:none">

            <!-- Chat Header -->
            <div class="chat-header" id="chatHeader">
                <!-- Back button (allows returning to list on mobile and desktop) -->
                <button class="icon-btn back-to-list" onclick="backToList()" title="Back to chats" aria-label="Back to chats">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>

                <div class="chat-header-info">
                    <div class="avatar avatar-md" id="chatAvatar">
                        <img src="" alt="" id="chatAvatarImg" style="display:none">
                        <span id="chatAvatarInitial"></span>
                    </div>
                    <div class="chat-user-details">
                        <span class="chat-username" id="chatUsername">–</span>
                        <span class="chat-status" id="chatStatus">Connecting…</span>
                    </div>
                </div>

                <div class="chat-header-actions">
                    <button class="icon-btn" title="Search messages" onclick="toggleChatSearch()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- In-chat search bar -->
            <div class="chat-search-bar" id="chatSearchBar" style="display:none">
                <input type="text" id="chatSearchInput" placeholder="Search messages…" oninput="searchChatMessages(this.value)">
                <button onclick="closeChatSearch()">✕</button>
            </div>

            <!-- Messages Area -->
            <div class="messages-container" id="messagesContainer">
                <div class="load-more-wrapper" id="loadMoreWrapper" style="display:none">
                    <button class="load-more-btn" onclick="loadMoreMessages()">Load older messages</button>
                </div>
                <!-- Messages injected here by JS -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator" style="display:none">
                <div class="typing-bubble">
                    <span></span><span></span><span></span>
                </div>
                <small id="typingText">is typing…</small>
            </div>

            <!-- Message Composer -->
            <div class="composer" id="composer">
                <!-- Media preview (shown before sending) -->
                <div class="media-preview" id="mediaPreview" style="display:none">
                    <div class="preview-content" id="previewContent"></div>
                    <button class="preview-cancel" onclick="cancelMediaPreview()">✕ Cancel</button>
                </div>

                <!-- Voice recording UI -->
                <div class="recording-ui" id="recordingUI" style="display:none">
                    <div class="recording-dot"></div>
                    <span class="recording-timer" id="recordingTimer">0:00</span>
                    <button class="cancel-record-btn" onclick="cancelRecording()">✕</button>
                    <button class="send-record-btn" onclick="stopAndSendRecording()">Send</button>
                </div>

                <!-- Normal composer row -->
                <div class="composer-row" id="composerRow">
                    <!-- Emoji button -->
                    <button class="icon-btn composer-btn" title="Emoji" onclick="toggleEmojiPicker()" id="emojiBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                    </button>

                    <!-- Attachment button -->
                    <button class="icon-btn composer-btn" title="Attach file" onclick="document.getElementById('fileInput').click()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" accept="image/*,video/*,audio/*" style="display:none" onchange="handleFileSelect(this)">

                    <!-- Text input -->
                    <div class="text-input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="Type a message…"
                            rows="1"
                            oninput="handleTyping()"
                            onkeydown="handleKeyDown(event)"
                        ></textarea>
                    </div>

                    <!-- Send / Mic button -->
                    <button class="icon-btn send-btn" id="sendBtn" title="Send message" onclick="sendTextMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                    <button class="icon-btn mic-btn" id="micBtn" title="Record voice message" onclick="startRecording()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                </div>

                <!-- Emoji Picker -->
                <div class="emoji-picker" id="emojiPicker" style="display:none">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </main>
</div>

<!-- ============================================================
     PROFILE MODAL
     ============================================================ -->
<div class="modal-overlay" id="profileModal" style="display:none" onclick="closeProfileModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>Profile & Settings</h3>
            <button class="modal-close" onclick="closeProfileModal()">✕</button>
        </div>
        <div class="modal-body" id="profileModalBody">
            <!-- Populated by JS -->
        </div>
    </div>
</div>

<!-- ============================================================
     IMAGE LIGHTBOX
     ============================================================ -->
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox()">
    <button class="lightbox-close">✕</button>
    <img src="" alt="" id="lightboxImg">
</div>

<!-- Toast notification area -->
<div class="toast-container" id="toastContainer"></div>

<!-- SocketIO client library (served by Flask-SocketIO) -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<!-- Our app scripts -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/audio.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>
</html>
